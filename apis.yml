aid: rivet
name: Rivet
description: >-
  Rivet is infrastructure for the agentic era, providing durable, stateful
  compute for AI agents and realtime applications. Its core primitive, Rivet
  Actors (RivetKit), is a runtime for long-lived processes that co-locate
  in-memory state with compute, support built-in WebSockets, workflows, queues,
  scheduling and cron, hibernate when idle, and scale from zero to thousands of
  instances across a global edge network. Rivet also ships agentOS, a
  lightweight WebAssembly-powered alternative to sandboxes for running coding
  agents, and Rivet Cloud, a managed serverless platform. RivetKit is open
  source (Apache-2.0), self-hostable on Postgres, the file system, or
  FoundationDB, with client SDKs for JavaScript, React, Rust, Swift and SwiftUI,
  a CLI, an OpenAPI-described gateway/inspector HTTP API and an AsyncAPI
  WebSocket protocol. Rivet is backed by Y Combinator and a16z Speedrun.
